name: Manual Spotlight Dispatch

on:
  workflow_dispatch:
    inputs:
      euri_model:
        description: 'EURI Model to use (e.g. gpt-4.1-mini, gpt-4o)'
        required: false
        default: 'gpt-4.1-mini'

permissions:
  contents: write

jobs:
  manual-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Manual Spotlight Pipeline
        env:
          EURI_API_KEY: ${{ secrets.EURI_API_KEY }}
          EURI_BASE_URL: ${{ secrets.EURI_BASE_URL || 'https://api.euron.one/api/v1/euri' }}
          EURI_MODEL: ${{ inputs.euri_model || secrets.EURI_MODEL || 'gpt-4.1-mini' }}
          EURI_MAX_TOKENS: ${{ secrets.EURI_MAX_TOKENS || '1500' }}
          EURI_TEMPERATURE: ${{ secrets.EURI_TEMPERATURE || '0.55' }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          DATABASE_PATH: data/history.db
        run: |
          python main.py run

      - name: Persist SQLite Database Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.db
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): manual spotlight state update [skip ci]"
            git push
          else
            echo "No database changes to commit."
          fi
